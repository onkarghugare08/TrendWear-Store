# TrendWear web tier: static SPA + reverse proxy for /api -> backend tier.
# Only this container is reachable from the host; the API is reached through it.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= express.json({ limit: "10mb" }) in backend/server.js
    client_max_body_size 10m;

    # Security headers (inherited by every location that does not add its own headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Using a variable makes nginx resolve "backend" at
    # request time, so the web tier still starts if the API is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:5000;

    # Liveness probe for the container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API tier. No URI in proxy_pass => the original /api/... path is forwarded unchanged.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Content-hashed Vite bundles can be cached forever
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA entry point and client-side routes: never cache index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
