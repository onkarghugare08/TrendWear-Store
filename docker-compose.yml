# =============================================================================
# TrendWear - three-tier production topology
#
#   Host :80 ──► [web]  nginx (static SPA + /api proxy)        network: frontend_net
#                  │
#                  ▼
#               [backend]  Node/Express API                    networks: frontend_net, data_net
#                  │                       │
#                  ▼                       ▼
#               [mongo]  MongoDB 7      [redis]  Redis 7       network: data_net (internal, no internet)
#
# Only `web` is published to the host. API, DB and cache are never exposed.
# Configuration comes from the .env file next to this file (see .env.example).
#
# Usage:
#   cp .env.example .env   # then fill in secrets
#   docker compose up -d --build
# =============================================================================

name: trendwear

x-restart: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Tier 1 - Web / presentation
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      target: runtime
    container_name: trendwear-web
    <<: [*restart-policy, *default-logging]
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Tier 2 - Application / API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: trendwear-api
    <<: [*restart-policy, *default-logging]
    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      # Connection strings point at service names on the internal data network
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-trendwear}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_TLS: "false"
      # Secrets and third-party keys (required)
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_net   # reachable from web
      - data_net       # reaches mongo + redis; outbound internet via frontend_net only
    # Not published to the host: only the web tier can call it
    expose:
      - "5000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Tier 3 - Data: MongoDB (primary store)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: trendwear-mongo
    <<: [*restart-policy, *default-logging]
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-trendwear}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Tier 3 - Data: Redis (refresh tokens + featured-products cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trendwear-redis
    <<: [*restart-policy, *default-logging]
    # AOF persistence so refresh tokens survive a restart; password-protected
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

# -----------------------------------------------------------------------------
# Named volumes: data survives `docker compose down` (use `down -v` to wipe)
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
    name: trendwear_mongo_data
  mongo_config:
    name: trendwear_mongo_config
  redis_data:
    name: trendwear_redis_data

# -----------------------------------------------------------------------------
# Networks: segmented tiers
#   frontend_net - web <-> backend, plus backend's outbound internet (Stripe, Cloudinary)
#   data_net     - internal: true, so the database and cache cannot reach the internet
# -----------------------------------------------------------------------------
networks:
  frontend_net:
    name: trendwear_frontend_net
    driver: bridge
  data_net:
    name: trendwear_data_net
    driver: bridge
    internal: true
